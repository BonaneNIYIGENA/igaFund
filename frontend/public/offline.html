<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#12312A" />
  <title>igaFund — Offline</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #EDF6F1;
      color: #12312A;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .logo{ width:72px; height:72px; margin-bottom:1.5rem; border-radius:16px; }
    h1{ font-size:1.5rem; font-weight:700; margin-bottom:0.5rem; }
    p{ color:#3d6b56; max-width:360px; line-height:1.6; margin-bottom:1.5rem; }
    .icon{
      width:48px; height:48px; margin-bottom:1rem;
      stroke: #3d6b56; fill:none; stroke-width:1.5;
      stroke-linecap:round; stroke-linejoin:round;
    }
    button{
      background:#12312A; color:#fff; border:none; border-radius:8px;
      padding:0.75rem 1.5rem; font-size:0.95rem; font-weight:600;
      cursor:pointer; transition: opacity 0.15s;
    }
    button:hover{ opacity:0.85; }
  </style>
</head>
<body>
  <img src="/logo.png" alt="igaFund" class="logo" />
  <svg class="icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <line x1="2" y1="2" x2="22" y2="22"/>
    <path d="M8.5 16.5a5 5 0 017 0"/>
    <path d="M2 8.82a15 15 0 014.17-2.65"/>
    <path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"/>
    <path d="M16.85 11.25a10 10 0 012.22 1.68"/>
    <path d="M5 12.86a10 10 0 015.09-2.78"/>
    <circle cx="12" cy="20" r="1"/>
  </svg>
  <h1>You're offline</h1>
  <p>
    Don't worry — any work you've already saved is safe on this device.
    When you reconnect, everything will sync automatically.
  </p>
  <button onclick="location.reload()">Try again</button>
</body>
</html>
