<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#12312A" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="igaFund — verified educational funding for underprivileged youth in Rwanda. Every contribution is paid directly to the student's school, never to a personal account." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" href="/logo.png" type="image/png" />
    <title>igaFund — School fees that reach the school</title>
    <script>
      // Set the theme before paint so switching pages/reloading never flashes the wrong one.
      (function () {
        var stored = localStorage.getItem("iga-theme");
        var theme = stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
